name: Generate & commit APT mirror index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# GitHub Pages serves this repository directly from the main branch (root),
# so the generated dists/ tree is committed back to main by this job.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Packages indexes
        run: python3 scripts/generate_index.py

      - name: Commit generated dists to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dists
          if git diff --cached --quiet; then
            echo "dists unchanged — nothing to commit"
          else
            git commit -q -m "Reindex mirror from catalog.json"
            git push
          fi